services:
  # --- Banco de Dados PostgreSQL 16 Otimizado Localmente ---
  db:
    image: postgres:16-alpine
    container_name: festa_db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-festa_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Tuning de performance mantido para a VPS
    command: >
      postgres
      -c timezone=America/Sao_Paulo
      -c shared_buffers=4GB
      -c work_mem=16MB
      -c effective_cache_size=10GB
      -c maintenance_work_mem=512MB
      -c max_connections=150
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # A porta externa foi desativada por segurança
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-festa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - festa_net

  # --- Aplicação Web FastAPI de Alta Performance ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: festa_web
    restart: unless-stopped
    # Conexões SSE usam descritores durante toda a visita. Define também o
    # limite efetivo para não herdar os 1024 arquivos por processo do host.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["gunicorn", "-k", "uvicorn.workers.UvicornWorker", "-w", "4", "-b", "0.0.0.0:8000", "--access-logfile", "-", "app.main:app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      ENVIRONMENT: ${FESTA_ENVIRONMENT:-production}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-festa_db}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      DB_ECHO: "false"
      WORKERS_COUNT: ${WORKERS_COUNT:-4}
      SMTP_FROM: ${SMTP_FROM:-ingresso@servindoor.com.br}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Serv indoor}
      SMTP_FROM_SECURITY: ${SMTP_FROM_SECURITY:-seguranca@servindoor.com.br}
      SMTP_FROM_COMMUNICATIONS: ${SMTP_FROM_COMMUNICATIONS:-comunicados@servindoor.com.br}
      SMTP_FROM_TEAM: ${SMTP_FROM_TEAM:-equipe@servindoor.com.br}
      EMAIL_SEND_RATE_PER_SECOND: ${EMAIL_SEND_RATE_PER_SECOND:-12}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-50000}
      GATEKEEPER_ENABLED: ${GATEKEEPER_ENABLED:-true}
      SITE_ACCESS_PIN: ${SITE_ACCESS_PIN:?Defina SITE_ACCESS_PIN no .env}
      SITE_ACCESS_EXPIRE_DAYS: ${SITE_ACCESS_EXPIRE_DAYS:-7}
      GATEKEEPER_MAX_TENTATIVAS: ${GATEKEEPER_MAX_TENTATIVAS:-3}
      API_KEY_EGPC: ${API_KEY_EGPC:-}
      RATE_LIMIT_RESERVA_MAX_IP: ${RATE_LIMIT_RESERVA_MAX_IP:-300}
      LOAD_TEST_SECRET: ${LOAD_TEST_SECRET:-}
      LOAD_TEST_LOTE_ID: ${LOAD_TEST_LOTE_ID:-0}
      LOAD_TEST_UNTIL: ${LOAD_TEST_UNTIL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./.env:/app/.env
    networks:
      - festa_net

  # --- Interface web opcional para administração do PostgreSQL ---
  adminer:
    image: adminer:4
    container_name: festa_adminer
    restart: unless-stopped
    profiles:
      - ferramentas
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_DB_DRIVER: pgsql
    # Mantém a interface fora da rede pública. Para acesso remoto, use túnel SSH.
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - festa_net

volumes:
  postgres_data:
    name: festa_postgres_data

networks:
  festa_net:
    name: festa_network
    driver: bridge

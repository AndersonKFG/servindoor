# Instalar no contexto http, por exemplo /etc/nginx/conf.d/servindoor-status.conf.
# Porta exclusiva de monitoramento, acessível apenas na própria VPS.
server {
    listen 127.0.0.1:18080;
    server_name localhost;
    access_log off;

    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 404;
    }
}
